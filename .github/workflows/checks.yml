name: Preset checks

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: preset-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check baseline and security invariants
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Validate the resolved Renovate configuration
        run: npx --yes --ignore-scripts --package=renovate@44.176.2 renovate-config-validator --strict default.json
